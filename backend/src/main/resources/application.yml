# Base configuration shared by all profiles.
# Secrets and environment-specific values come ONLY from environment variables or profile files
# (application-local.yml for development). Nothing secret is committed here.
#
# Profiles: local (developer machine), test (automated tests), staging, prod.
# `./mvnw spring-boot:run` uses `local` by default (see pom.xml: spring-boot.run.profiles).

spring:
  application:
    name: tapin
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates the mapping.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30d
      cookie:
        name: TAPIN_SESSION
        http-only: true
        secure: true
        same-site: lax

tapin:
  club:
    name: ${CLUB_NAME:BJJ klub}
    time-zone: Europe/Zagreb
  mail:
    from: ${MAIL_FROM}
  bootstrap:
    admin:
      # First administrator, created only while no active administrator exists. No default password anywhere
      # except the local profile; remove ADMIN_PASSWORD from the environment after the first start.
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      first-name: ${ADMIN_FIRST_NAME:Administrator}
      last-name: ${ADMIN_LAST_NAME:TapIn}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/v1/**

logging:
  level:
    root: INFO
