# Base configuration shared by all profiles.
# Secrets and environment-specific values come ONLY from environment variables or profile files
# (application-local.yml for development). Nothing secret is committed here.
#
# Profiles: local (developer machine), test (automated tests), staging, prod.
# `./mvnw spring-boot:run` uses `local` by default (see pom.xml: spring-boot.run.profiles).

spring:
  application:
    name: tapin
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates the mapping.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      # Must stay well below tapin.outbox.lease, otherwise a slow send could be re-claimed by another worker.
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:false}
      mail.smtp.ssl.enable: ${MAIL_SSL:false}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30d
      cookie:
        name: TAPIN_SESSION
        http-only: true
        secure: true
        same-site: lax

tapin:
  app:
    # Public HTTPS origin of the web app, used for links in e-mails (invitations, password reset).
    base-url: ${APP_BASE_URL}
  invitation:
    validity: 7d
  club:
    name: ${CLUB_NAME:BD Samobor}
    time-zone: Europe/Zagreb
  mail:
    from: ${MAIL_FROM}
    # smtp (Mailpit locally), gmail (HTTPS OAuth; GMAIL_CLIENT_ID/SECRET/REFRESH_TOKEN), or log (no delivery)
    provider: ${MAIL_PROVIDER:smtp}
  schedule:
    # Sessions are materialised from weekly rules this many days ahead (spec §4.2).
    horizon-days: 60
    materialize-interval: 6h
    held-transition-interval: 1m
  reminders:
    # Reminder start_at - lead to REGISTERED members (spec §8.2); missed runs are caught up until the start (D-04).
    enabled: ${REMINDERS_ENABLED:true}
    lead: 3h
    interval: 1m
  push:
    # Web push (optional channel for training reminders). Off unless both VAPID keys are set; generate a pair with
    # `node scripts/generate-vapid-keys.mjs`. The private key is a secret: environment only, never committed.
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    vapid-subject: ${VAPID_SUBJECT:mailto:no-reply@tapin.local}
    timeout: 10s
  outbox:
    poll-interval: 10s
    batch-size: 20
    lease: 2m
    max-attempts: 8
    initial-backoff: 1m
    max-backoff: 1h
    alert:
      # OUTBOX_DEGRADED (ERROR log, gauge tapin.outbox.degraded=1) while a PENDING e-mail is older than this.
      after: 30m
      interval: 1m
      repeat: 1h
  bootstrap:
    admin:
      # First administrator, created only while no active administrator exists. No default password anywhere
      # except the local profile; remove ADMIN_PASSWORD from the environment after the first start.
      email: ${ADMIN_EMAIL:admin@tapin.com}
      password: ${ADMIN_PASSWORD:admin}
      first-name: ${ADMIN_FIRST_NAME:Administrator}
      last-name: ${ADMIN_LAST_NAME:}

management:
  endpoints:
    web:
      exposure:
        # metrics: ADMIN only (ApiAuthorizationRules), e.g. /actuator/metrics/tapin.outbox.messages
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/v1/**

logging:
  level:
    root: INFO
