# Developer machine. Values match docker-compose.yml defaults so a fresh clone runs without edits.
# These are throw-away local credentials, not secrets. Override any of them with environment variables
# (e.g. DB_PASSWORD=... ./mvnw spring-boot:run) if your local setup differs.

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tapin}
    username: ${DB_USER:tapin}
    password: ${DB_PASSWORD:tapin}
  mail:
    # Mailpit from docker-compose: SMTP on 1025, web UI on http://localhost:8025
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  jpa:
    show-sql: false

server:
  servlet:
    session:
      cookie:
        # Local dev runs over plain HTTP.
        secure: false

tapin:
  club:
    name: ${CLUB_NAME:BJJ klub (local)}
  mail:
    from: ${MAIL_FROM:no-reply@tapin.local}
  bootstrap:
    admin:
      # LOCAL DEVELOPMENT ONLY - never used by staging/prod (they have no default; see application.yml).
      email: ${ADMIN_EMAIL:admin@tapin.local}
      password: ${ADMIN_PASSWORD:local-dev-admin-password}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.tapin: DEBUG
    org.flywaydb: INFO
