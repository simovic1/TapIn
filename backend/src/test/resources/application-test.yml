# Automated tests. The datasource is provided by Testcontainers (@ServiceConnection), so no DB_* variables
# are needed. Mail is never actually sent in tests.

spring:
  mail:
    host: localhost
    port: 2525

server:
  servlet:
    session:
      cookie:
        secure: false

tapin:
  app:
    base-url: https://tapin.test
  club:
    name: Test klub
  mail:
    from: test@tapin.local
    provider: log
  # Tests drive the outbox processor explicitly.
  scheduling:
    enabled: false
  outbox:
    worker:
      enabled: false
  bootstrap:
    admin:
      # Tests call AdminBootstrapService explicitly.
      enabled: false
