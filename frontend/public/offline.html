<!doctype html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141012" />
    <title>TapIn – nema internetske veze</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #141012; color: #fff; font: 1.1rem/1.6 system-ui, sans-serif; }
      main { max-width: 30rem; padding: 2rem; }
      h1 { line-height: 1.2; }
      button { padding: .8rem 1.2rem; font: inherit; background: #d71a20; color: white; border: 0; border-radius: .5rem; cursor: pointer; }
      button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p>TapIn</p>
      <h1>Nema internetske veze</h1>
      <p>Za raspored, prijave i evidenciju potrebna je veza s poslužiteljem. Poveži se s internetom i pokušaj ponovno.</p>
      <button onclick="location.reload()">Pokušaj ponovno</button>
    </main>
  </body>
</html>
